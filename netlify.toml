[build]
  command = "pnpm run build:all"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Pinned to match local dev (node --version) so "builds locally" reliably means
  # "will build on Netlify too" — the main realistic gap otherwise. pnpm version
  # is already pinned via package.json's "packageManager" field.
  NODE_VERSION = "22.16.0"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "astro dev"
  targetPort = 4321
  port = 8888
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    # Content-Security-Policy is generated into dist/_headers by scripts/build-csp.mjs (hashes of inline blocks).

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
