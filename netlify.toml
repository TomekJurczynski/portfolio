[build]
  command = "pnpm run build:all"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Pinned to match local dev (node --version) so "builds locally" reliably means
  # "will build on Netlify too" — the main realistic gap otherwise. pnpm version
  # is already pinned via package.json's "packageManager" field.
  # 22.23.3 (not 22.16.0): pnpm 12 ships bin/pnpm.mjs and the Corepack bundled with Node 22.16 (0.32)
  # fails with "Cannot find module .../pnpm/12.8.1/bin/pnpm.cjs" (also 0.34.0-0.34.3). Node 22.23.3 bundles
  # Corepack 0.36, which runs it. Keep Node in step with the pnpm version in package.json "packageManager".
  NODE_VERSION = "22.23.3"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "astro dev"
  targetPort = 4321
  port = 8888
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    # Content-Security-Policy is generated into dist/_headers by scripts/build-csp.mjs (hashes of inline blocks).

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
